name: Apply exclusive fan profile role fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply targeted patch
        run: python3 scripts/applyFanRoleExclusivePatch.py
      - name: Install dependencies
        run: npm ci
      - name: Role logic tests
        run: node tests/profileRoles.logic.test.mjs
      - name: Role integration source tests
        run: node tests/profileRoles.source.test.mjs
      - name: Migration tests
        run: node tests/reconcileExclusiveFanProfileRoles.test.mjs
      - name: Existing public profile tests
        run: node tests/publicUserPublication.test.mjs
      - name: Existing public backfill tests
        run: node tests/backfillPublicUsersFromUsers.test.mjs
      - name: Firestore role rules tests
        run: npx firebase emulators:exec --only firestore "node tests/firestore.profileRoles.rules.test.mjs"
      - name: Build
        run: npm run build
      - name: Remove temporary patch runner
        run: rm -f scripts/applyFanRoleExclusivePatch.py .github/workflows/apply-fan-role-exclusive.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce exclusive fan profile role"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
