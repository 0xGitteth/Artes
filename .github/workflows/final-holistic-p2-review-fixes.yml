name: Final holistic P2 review fixes

on:
  push:
    branches:
      - chatgpt/final-holistic-isolation-cleanup

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: node scripts/repairFinalHolisticP2Patcher.mjs
      - run: node scripts/applyFinalHolisticReviewP2Fixes.mjs
      - run: node --check functions/supportChat.js
      - run: node --check functions/codexDevActorRegistry.js
      - run: node --check functions/scripts/reconcileCodexDevIsolation.js
      - run: npm run test:codex-dev-isolation
      - run: node tests/moodboards.logic.test.mjs
      - run: node tests/profileAffiliationStatus.logic.test.mjs
      - run: npm run test:rules
      - run: npm run test:public-user-publication
      - run: npm run test:reconcile-public-users
      - run: npm run test:backfill-public-users
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit validated fixes and remove temporary automation
        run: |
          rm scripts/repairFinalHolisticP2Patcher.mjs
          rm scripts/applyFinalHolisticReviewP2Fixes.mjs
          rm .github/workflows/final-holistic-p2-review-fixes.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git commit -m "close final holistic P2 review findings"
          git push origin HEAD:chatgpt/final-holistic-isolation-cleanup
