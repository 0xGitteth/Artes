name: Train approved moderation detector

on:
  workflow_dispatch:
    inputs:
      dataset_run_id:
        description: 'Workflow run ID holding an approved dataset artifact'
        required: true
        type: string
      dataset_artifact:
        description: 'Artifact containing dataset.json and approved media or embeddings'
        required: true
        default: 'approved-moderation-dataset'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  train-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dataset_artifact }}
          run-id: ${{ inputs.dataset_run_id }}
          github-token: ${{ github.token }}
          path: approved-dataset
      - name: Install CPU inference and training dependencies
        run: |
          python -m pip install 'torch>=2.2,<3' 'torchvision>=0.17,<1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r vision-service/requirements-training.txt
      - name: Train, calibrate and benchmark without promotion
        run: python vision-service/train_detector.py --dataset approved-dataset/dataset.json --output-dir detector-output
      - uses: actions/upload-artifact@v4
        with:
          name: moderation-detector-candidate
          path: detector-output/
          retention-days: 7
          if-no-files-found: error
