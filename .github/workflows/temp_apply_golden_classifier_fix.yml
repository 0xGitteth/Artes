name: Temporary apply golden classifier fix

on:
  push:
    branches:
      - chatgpt/moderation-architecture-simplification
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/moderation-architecture-simplification
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          python -m pip install --quiet openpyxl==3.1.5

      - name: Apply classifier boundary fix and golden baseline correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import json
          import openpyxl

          contract = Path('functions/geminiModerationContract.js')
          s = contract.read_text()
          covered_needle = "  '- underwear, lingerie, swimwear, a thong, or a string when intimate areas remain covered.',\n  '',\n  'Sexual context can still make a clothed image adult-only:',"
          covered_repl = "  '- underwear, lingerie, swimwear, a thong, or a string when intimate areas remain covered.',\n  '',\n  'adultDecision describes nudity / sexual explicitness only; adult-only sexual context is represented separately by triggers.',\n  '- Covered lingerie/underwear remains adultDecision=\\\"none\\\" when breasts, nipples, genitals and buttocks are not exposed and the visible body/clothing/crop does not create the appearance of nudity.',\n  '- BDSM equipment, rope, restraints, fetish styling, erotic posing or sexual suggestion do NOT by themselves count as implied nudity. They may require adultEroticSuggestive/kinkBdsm triggers while adultDecision stays \\\"none\\\".',\n  '- Do not infer nudity merely because a clothed BDSM/kink image is sexual or fetishistic.',\n  '',\n  'Sexual context can still make a clothed image adult-only:',"
          explicit_needle = "  '- \\\"explicit\\\": a clear sexual act is visible, such as penetration, oral sex, masturbation, genital stimulation, or another unambiguous sex act.',"
          explicit_repl = explicit_needle + "\n  '- Visible genitals alone are NOT a sexual act. A close-up of exposed genitals, including visible natural moisture or a droplet/fluid, stays adultDecision=\\\"borderline\\\" unless the image also visibly shows touching/stimulation, penetration, oral contact, masturbation or another unambiguous sex act.'" + "\n  '- Do not infer masturbation, stimulation or penetration from arousal, wetness, bodily fluid, pose, framing or a genital close-up alone. The act itself must be visibly evidenced.'"
          if covered_needle not in s:
              raise SystemExit('covered prompt insertion point not found')
          if explicit_needle not in s:
              raise SystemExit('explicit prompt insertion point not found')
          s = s.replace(covered_needle, covered_repl, 1)
          s = s.replace(explicit_needle, explicit_repl, 1)
          contract.write_text(s)

          test_path = Path('functions/test/geminiModerationContract.test.js')
          t = test_path.read_text()
          nudity_assert = "  assert.match(prompt, /underwear, lingerie, swimwear, a thong, or a string/i);"
          nudity_repl = nudity_assert + "\n  assert.match(prompt, /BDSM equipment, rope, restraints.*do NOT by themselves count as implied nudity/i);\n  assert.match(prompt, /adult-only sexual context is represented separately by triggers/i);"
          erotic_assert = "  assert.match(prompt, /penetration, oral sex, masturbation/i);"
          erotic_repl = erotic_assert + "\n  assert.match(prompt, /Visible genitals alone are NOT a sexual act/i);\n  assert.match(prompt, /Do not infer masturbation, stimulation or penetration from arousal, wetness, bodily fluid/i);"
          if nudity_assert not in t or erotic_assert not in t:
              raise SystemExit('contract test insertion point not found')
          t = t.replace(nudity_assert, nudity_repl, 1)
          t = t.replace(erotic_assert, erotic_repl, 1)
          test_path.write_text(t)

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          old = pkg['scripts']['test:moderation-policy']
          marker = 'functions/test/geminiModerationContract.test.js'
          addition = 'functions/test/moderationGoldenClassifierExpectations.test.js'
          if addition not in old:
              if marker not in old:
                  raise SystemExit('package test marker not found')
              pkg['scripts']['test:moderation-policy'] = old.replace(marker, marker + ' ' + addition, 1)
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          csv_path = Path('testing/moderation_goldens_v1/testcases_reviewed_v3_semicolon.csv')
          with csv_path.open('r', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f, delimiter=';'))
              fields = list(rows[0].keys())
          for row in rows:
              if row['case_id'] == 'SAFE_01':
                  row.update({
                      'case_id': 'ADULT_BDSM_01',
                      'filename': 'images/adult/ADULT_BDSM_01.jpg',
                      'category': 'adult',
                      'safety_tag_inputs': '18+ BDSM / kink',
                      'expected_content_truth': 'covered BDSM/kink without nudity or explicit sexual act',
                      'expected_ai_result': 'adult_context',
                      'expected_policy_result': 'adult',
                      'expected_final_result': 'adult',
                      'expected_ui_result': 'visible only with active 18+ entitlement',
                      'notes': 'Policy v2 correction after non-production live classifier inspection: this legacy SAFE_01 image contains covered BDSM/kink context. It is adult via erotic/kink triggers, but adultDecision must remain none because no nudity or explicit sexual act is visible.',
                  })
              elif row['case_id'] == 'BORDERLINE_01':
                  row.update({
                      'expected_ai_result': 'adult_nudity',
                      'expected_policy_result': 'adult',
                      'expected_final_result': 'adult',
                      'expected_ui_result': 'visible only with active 18+ entitlement',
                      'notes': 'Policy v2 correction: visible genitalia without a visible sexual act is adult nudity, not explicit sexual content and not automatically review. Human review is reserved for genuine safety or explicit-act uncertainty.',
                  })
          with csv_path.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields, delimiter=';', lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          xlsx_path = Path('testing/moderation_goldens_v1/testcases_reviewed_v3.xlsx')
          wb = openpyxl.load_workbook(xlsx_path)
          changed = False
          for ws in wb.worksheets:
              headers = {str(cell.value).strip(): idx + 1 for idx, cell in enumerate(ws[1]) if cell.value is not None}
              if 'case_id' not in headers:
                  continue
              for r in range(2, ws.max_row + 1):
                  case = ws.cell(r, headers['case_id']).value
                  if case == 'SAFE_01':
                      values = {
                          'case_id': 'ADULT_BDSM_01',
                          'filename': 'images/adult/ADULT_BDSM_01.jpg',
                          'category': 'adult',
                          'safety_tag_inputs': '18+ BDSM / kink',
                          'expected_content_truth': 'covered BDSM/kink without nudity or explicit sexual act',
                          'expected_ai_result': 'adult_context',
                          'expected_policy_result': 'adult',
                          'expected_final_result': 'adult',
                          'expected_ui_result': 'visible only with active 18+ entitlement',
                          'notes': 'Policy v2 correction after non-production live classifier inspection: this legacy SAFE_01 image contains covered BDSM/kink context. It is adult via erotic/kink triggers, but adultDecision must remain none because no nudity or explicit sexual act is visible.',
                      }
                      for key, value in values.items():
                          if key in headers:
                              ws.cell(r, headers[key]).value = value
                      changed = True
                  elif case == 'BORDERLINE_01':
                      values = {
                          'expected_ai_result': 'adult_nudity',
                          'expected_policy_result': 'adult',
                          'expected_final_result': 'adult',
                          'expected_ui_result': 'visible only with active 18+ entitlement',
                          'notes': 'Policy v2 correction: visible genitalia without a visible sexual act is adult nudity, not explicit sexual content and not automatically review. Human review is reserved for genuine safety or explicit-act uncertainty.',
                      }
                      for key, value in values.items():
                          if key in headers:
                              ws.cell(r, headers[key]).value = value
                      changed = True
          if not changed:
              raise SystemExit('xlsx golden rows were not found')
          wb.save(xlsx_path)
          PY

          mkdir -p testing/moderation_goldens_v1/images/adult
          git mv testing/moderation_goldens_v1/images/safe/SAFE_01.jpg testing/moderation_goldens_v1/images/adult/ADULT_BDSM_01.jpg

          cat > functions/moderationGoldenClassifierExpectations.js <<'EOF'
          const DURABLE_ADULT_CONTEXT_CONFIDENCE = 0.7;

          const forbiddenReasons = (parsed) => (
            Array.isArray(parsed?.forbiddenReasons) ? parsed.forbiddenReasons : []
          );

          const hasTrigger = (parsed, trigger, minConfidence = 0) => (
            Array.isArray(parsed?.triggers)
            && parsed.triggers.some((item) => (
              item?.trigger === trigger
              && typeof item?.confidence === 'number'
              && item.confidence >= minConfidence
            ))
          );

          const hasDurableAdultContext = (parsed) => (
            hasTrigger(parsed, 'adultEroticSuggestive', DURABLE_ADULT_CONTEXT_CONFIDENCE)
            || hasTrigger(parsed, 'kinkBdsm', DURABLE_ADULT_CONTEXT_CONFIDENCE)
          );

          export const getGoldenClassifierExpectationFailure = ({ id, result }) => {
            const parsed = result?.parsed || null;
            const safetyBlocked = result?.diagnostics?.safetyBlocked === true;

            if (id === 'BOUDOIR_01' && safetyBlocked) return null;
            if (id === 'EXPLICIT_01' && safetyBlocked) return null;
            if (!parsed) return `${id}: expected a validated classifier result`;

            if (id === 'ADULT_BDSM_01') {
              if (parsed.adultDecision !== 'none') return `${id}: covered BDSM/kink must not be labelled as nudity`;
              if (forbiddenReasons(parsed).length) return `${id}: covered non-explicit BDSM/kink must not be forbidden`;
              if (!hasTrigger(parsed, 'adultEroticSuggestive', DURABLE_ADULT_CONTEXT_CONFIDENCE)) return `${id}: missing durable adultEroticSuggestive trigger`;
              if (!hasTrigger(parsed, 'kinkBdsm', DURABLE_ADULT_CONTEXT_CONFIDENCE)) return `${id}: missing durable kinkBdsm trigger`;
              return null;
            }

            if (id === 'BOUDOIR_01') {
              if (parsed.adultDecision !== 'none') return `${id}: covered ordinary boudoir must remain non-nude`;
              if (forbiddenReasons(parsed).length) return `${id}: covered ordinary boudoir must not be forbidden`;
              if (hasDurableAdultContext(parsed)) return `${id}: ordinary boudoir must not gain durable erotic/kink adult context`;
              return null;
            }

            if (id === 'BORDERLINE_01') {
              if (parsed.adultDecision !== 'borderline') return `${id}: visible genitalia without a visible sex act must remain borderline adult nudity`;
              if (forbiddenReasons(parsed).includes('sexualExplicit')) return `${id}: visible genitalia alone must not become sexualExplicit`;
              if (!(typeof parsed.sexualExplicitConfidence === 'number' && parsed.sexualExplicitConfidence < 0.5)) return `${id}: non-explicit nudity must keep sexualExplicitConfidence below 0.5`;
              return null;
            }

            if (id === 'EXPLICIT_01') {
              if (parsed.adultDecision !== 'explicit') return `${id}: visible explicit sexual act must be explicit`;
              if (!forbiddenReasons(parsed).includes('sexualExplicit')) return `${id}: explicit sexual act must include sexualExplicit forbidden reason`;
              if (!(typeof parsed.sexualExplicitConfidence === 'number' && parsed.sexualExplicitConfidence >= 0.5)) return `${id}: explicit sexual act must have sexualExplicitConfidence >= 0.5`;
              return null;
            }

            return `${id}: no golden classifier expectation is defined`;
          };
          EOF

          cat > functions/test/moderationGoldenClassifierExpectations.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { getGoldenClassifierExpectationFailure } from '../moderationGoldenClassifierExpectations.js';

          const result = (parsed, diagnostics = {}) => ({ parsed, diagnostics });
          const trigger = (name, confidence) => ({ trigger: name, confidence, severity: 'suggest', graphic: false });

          test('accepts covered BDSM as adult context without nudity', () => {
            assert.equal(getGoldenClassifierExpectationFailure({
              id: 'ADULT_BDSM_01',
              result: result({
                triggers: [trigger('adultEroticSuggestive', 0.85), trigger('kinkBdsm', 0.8)],
                forbiddenReasons: [],
                adultDecision: 'none',
                sexualExplicitConfidence: 0.1,
              }),
            }), null);
          });

          test('rejects covered BDSM when adultDecision incorrectly becomes borderline', () => {
            assert.match(getGoldenClassifierExpectationFailure({
              id: 'ADULT_BDSM_01',
              result: result({
                triggers: [trigger('adultEroticSuggestive', 0.9), trigger('kinkBdsm', 0.9)],
                forbiddenReasons: [],
                adultDecision: 'borderline',
                sexualExplicitConfidence: 0.1,
              }),
            }), /must not be labelled as nudity/);
          });

          test('accepts ordinary boudoir or a provider safety block for fail-closed review', () => {
            assert.equal(getGoldenClassifierExpectationFailure({
              id: 'BOUDOIR_01',
              result: result({ triggers: [], forbiddenReasons: [], adultDecision: 'none', sexualExplicitConfidence: 0 }),
            }), null);
            assert.equal(getGoldenClassifierExpectationFailure({
              id: 'BOUDOIR_01',
              result: result(null, { safetyBlocked: true }),
            }), null);
          });

          test('keeps visible genitalia without a sex act non-explicit', () => {
            assert.equal(getGoldenClassifierExpectationFailure({
              id: 'BORDERLINE_01',
              result: result({
                triggers: [trigger('adultEroticSuggestive', 0.9)],
                forbiddenReasons: [],
                adultDecision: 'borderline',
                sexualExplicitConfidence: 0.2,
              }),
            }), null);
            assert.match(getGoldenClassifierExpectationFailure({
              id: 'BORDERLINE_01',
              result: result({
                triggers: [],
                forbiddenReasons: ['sexualExplicit'],
                adultDecision: 'explicit',
                sexualExplicitConfidence: 0.9,
              }),
            }), /must remain borderline adult nudity/);
          });

          test('requires explicit sexual acts to be forbidden, while accepting a provider safety block', () => {
            assert.equal(getGoldenClassifierExpectationFailure({
              id: 'EXPLICIT_01',
              result: result({
                triggers: [],
                forbiddenReasons: ['sexualExplicit'],
                adultDecision: 'explicit',
                sexualExplicitConfidence: 0.95,
              }),
            }), null);
            assert.equal(getGoldenClassifierExpectationFailure({
              id: 'EXPLICIT_01',
              result: result(null, { safetyBlocked: true }),
            }), null);
          });
          EOF

          cat > functions/scripts/runModerationGoldenV2Classifier.js <<'EOF'
          import { access, readFile, stat } from 'node:fs/promises';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { runGeminiClassifier } from '../geminiModerationClassifier.js';
          import { getGoldenClassifierExpectationFailure } from '../moderationGoldenClassifierExpectations.js';

          const scriptDir = path.dirname(fileURLToPath(import.meta.url));
          const repoRoot = path.resolve(scriptDir, '..', '..');
          const dryRun = process.argv.includes('--dry-run');

          const cases = [
            {
              id: 'ADULT_BDSM_01',
              file: 'testing/moderation_goldens_v1/images/adult/ADULT_BDSM_01.jpg',
              policyExpectation: 'adult allow: covered BDSM/kink without nudity or an explicit sexual act',
            },
            {
              id: 'BOUDOIR_01',
              file: 'testing/moderation_goldens_v1/images/boudoir/BOUDOIR_01.jpg',
              policyExpectation: 'general allow when intimate parts remain covered and no other adult context is present; provider safety block may fail closed to review',
            },
            {
              id: 'BORDERLINE_01',
              file: 'testing/moderation_goldens_v1/images/borderline/BORDERLINE_01.jpg',
              policyExpectation: 'adult allow when nudity is present without a visible explicit sexual act',
            },
            {
              id: 'EXPLICIT_01',
              file: 'testing/moderation_goldens_v1/images/explicit/EXPLICIT_01.jpg',
              policyExpectation: 'forbidden when a clear explicit sexual act is present; provider safety block is also fail closed',
            },
          ];

          const assertGoldenFiles = async () => {
            const metadata = [];
            for (const item of cases) {
              const absolutePath = path.resolve(repoRoot, item.file);
              await access(absolutePath);
              const info = await stat(absolutePath);
              metadata.push({
                id: item.id,
                file: item.file,
                bytes: info.size,
                policyExpectation: item.policyExpectation,
              });
            }
            return metadata;
          };

          const main = async () => {
            const metadata = await assertGoldenFiles();

            if (dryRun) {
              console.log(JSON.stringify({
                mode: 'dry-run',
                note: 'Files and current policy expectations verified. No external AI call was made.',
                cases: metadata,
              }, null, 2));
              return;
            }

            if (process.env.ENABLE_GEMINI_CLASSIFIER !== 'true') {
              throw new Error('Set ENABLE_GEMINI_CLASSIFIER=true to run the real-image classifier golden test.');
            }
            if (!process.env.GOOGLE_CLOUD_PROJECT) {
              throw new Error('Set GOOGLE_CLOUD_PROJECT to an authenticated non-production Google Cloud project.');
            }

            const results = [];
            let hadFailure = false;

            for (const item of cases) {
              const absolutePath = path.resolve(repoRoot, item.file);
              const buffer = await readFile(absolutePath);
              try {
                const result = await runGeminiClassifier({ buffer, mimeType: 'image/jpeg' });
                const expectationFailure = getGoldenClassifierExpectationFailure({ id: item.id, result });
                if (expectationFailure) hadFailure = true;
                results.push({
                  id: item.id,
                  file: item.file,
                  policyExpectation: item.policyExpectation,
                  expectationPassed: !expectationFailure,
                  expectationFailure,
                  parsed: result?.parsed || null,
                  diagnostics: result?.diagnostics || null,
                });
              } catch (error) {
                hadFailure = true;
                results.push({
                  id: item.id,
                  file: item.file,
                  policyExpectation: item.policyExpectation,
                  expectationPassed: false,
                  error: {
                    name: error?.name || 'Error',
                    message: error?.message || String(error),
                    code: error?.code || null,
                  },
                });
              }
            }

            console.log(JSON.stringify({
              mode: 'classifier-golden',
              warning: 'This calls Gemini only. It does not exercise the full moderateImage endpoint, SafeSearch, Firestore lifecycle, or publication flow.',
              cases: results,
            }, null, 2));

            if (hadFailure) process.exitCode = 1;
          };

          main().catch((error) => {
            console.error(error?.stack || error?.message || String(error));
            process.exitCode = 1;
          });
          EOF

          cat > testing/moderation_goldens_v1/README.txt <<'EOF'
          Deze map bevat de moderation golden tests.

          Moderatiebeleid v2:
          - fixtures/policy-boundary-cases.json is de bron voor de policy unit tests.
          - functions/test/moderationPolicyBoundaries.test.js test deze grenzen zonder externe AI calls.
          - de Gemini classifier is gekoppeld aan de live moderation flow in functions/index.js.

          De echte beeldset staat in:
          - images/adult/ADULT_BDSM_01.jpg
          - images/boudoir/BOUDOIR_01.jpg
          - images/borderline/BORDERLINE_01.jpg
          - images/explicit/EXPLICIT_01.jpg

          De voormalige SAFE_01 fixture bleek bij visuele en live-classifiercontrole geen algemene safe fixture te zijn maar volledig bedekte BDSM/kink content. De fixture is daarom hernoemd naar ADULT_BDSM_01 en de CSV/XLSX baseline is aangepast aan policy v2. BORDERLINE_01 is eveneens gecorrigeerd: zichtbare genitalien zonder zichtbare seksuele handeling zijn 18+ nudity en niet automatisch review of explicit.

          Voor policy v2 gelden de actuele productgrenzen uit docs/moderation-policy-v2.md:
          - gewone veilige content -> general allow;
          - gewone boudoir/lingerie met intieme delen bedekt -> general allow;
          - duidelijk erotische/suggestieve of BDSM/kink context -> 18+ allow, ook wanneer adultDecision voor nudity zelf none blijft;
          - duidelijke of geïmpliceerde naaktheid zonder expliciete seksuele handeling -> 18+ allow;
          - expliciete seksuele handelingen -> forbidden;
          - echte onzekerheid of sterke tegenstrijdige safety-signalen -> review.

          De real-image Gemini runner is een uitvoerbare golden test:

          npm run golden:moderation-v2:classifier

          Met --dry-run worden alleen de vier bestanden en verwachtingen gecontroleerd en wordt geen externe AI call gedaan:

          npm run golden:moderation-v2:classifier -- --dry-run

          De echte runner vereist ENABLE_GEMINI_CLASSIFIER=true, geauthenticeerde non-production Google Cloud credentials en GOOGLE_CLOUD_PROJECT. Hij faalt nu ook wanneer een geval wel technisch classificeert maar de policyverwachting mist.

          De runner accepteert voor BOUDOIR_01 een Vertex provider safety block als fail-closed uitkomst, omdat de provider de beeldanalyse dan zelf weigert. De applicatie moet zo'n safety block naar review houden. Voor EXPLICIT_01 is een provider safety block eveneens een veilige fail-closed uitkomst. ADULT_BDSM_01 en BORDERLINE_01 moeten daadwerkelijk correct worden geclassificeerd zodat overblocking en de explicit/nudity grens zichtbaar blijven in deze golden test.

          De runner schrijft niets naar Firestore en gebruikt niet de productie moderation endpoint. Hij test alleen de echte beelden tegen de Gemini classifier. SafeSearch, Firestore moderation history/review lifecycle en publication flow vallen buiten deze runner en blijven onderdeel van een gecontroleerde pre-deploy E2E.

          Gebruik voor tests niet de productie moderation endpoint, omdat die upload/moderation state kan schrijven.
          EOF

          git grep -n 'SAFE_01' -- ':!testing/moderation_goldens_v1/testcases_reviewed_v3.xlsx' && {
            echo 'Unexpected textual SAFE_01 reference remains';
            exit 1;
          } || true

      - name: Focused unit validation
        run: |
          node --test functions/test/geminiModerationContract.test.js functions/test/moderationGoldenClassifierExpectations.test.js
          npm run golden:moderation-v2:classifier -- --dry-run
          git diff --check

      - name: Authenticate to non-production Vertex
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712508684856/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: artes-moderation-golden@artes-staging.iam.gserviceaccount.com

      - name: Run real-image golden classifier in staging
        env:
          ENABLE_GEMINI_CLASSIFIER: 'true'
          GOOGLE_CLOUD_PROJECT: artes-staging
          GOOGLE_CLOUD_LOCATION: europe-west4
          GEMINI_MODEL: gemini-2.5-flash
        run: npm run golden:moderation-v2:classifier

      - name: Commit validated changes and remove temporary workflow
        run: |
          git rm .github/workflows/temp_apply_golden_classifier_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Gemini adult boundary goldens'
          git push origin HEAD:chatgpt/moderation-architecture-simplification
