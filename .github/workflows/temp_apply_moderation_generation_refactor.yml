name: Temporary apply moderation generation refactor

on:
  push:
    branches:
      - chatgpt/moderation-architecture-simplification

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm --prefix functions ci
      - name: Fix temporary refactor harness matches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/temp_refactor_moderation_generation.py')
          source = path.read_text()

          replacements = [
              (
                  '"const findExactUpload = async (sha256, { isCodexActor = false, themes = [], makerTags = [] } = {}) => (",',
                  '"const findExactUpload = async (sha256, { isCodexActor = false, themes = [], makerTags = [] } = {}) => {",',
                  'exact-upload old signature',
              ),
              (
                  '"const findExactUpload = async (sha256, { isCodexActor = false, themes = [], makerTags = [], currentGeneration = 0 } = {}) => (",',
                  '"const findExactUpload = async (sha256, { isCodexActor = false, themes = [], makerTags = [], currentGeneration = 0 } = {}) => {",',
                  'exact-upload new signature',
              ),
          ]
          for old, new, label in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'{label}: expected one harness match, found {source.count(old)}')
              source = source.replace(old, new, 1)

          old_block = '''replace_once(
              "      uploaderUid: userId || null,",
              "      uploaderUid: userId || null,\\n      moderationGeneration: requestModerationGeneration,\\n      moderationScopeKey: requestModerationScope.scopeKey,",
              'upload generation provenance',
          )'''
          new_block = '''replace_once(
              """    const uploadPayload = {
                userId: userId || null,
                uploaderUid: userId || null,
                ...(isCodexActor ? { testActor: CODEX_DEV_ACTOR } : {}),""",
              """    const uploadPayload = {
                userId: userId || null,
                uploaderUid: userId || null,
                moderationGeneration: requestModerationGeneration,
                moderationScopeKey: requestModerationScope.scopeKey,
                ...(isCodexActor ? { testActor: CODEX_DEV_ACTOR } : {}),""",
              'upload generation provenance',
          )'''
          if source.count(old_block) != 1:
              raise SystemExit(f'upload provenance harness block: expected one match, found {source.count(old_block)}')
          source = source.replace(old_block, new_block, 1)

          path.write_text(source)
          PY
      - name: Apply generation refactor
        run: python3 scripts/temp_refactor_moderation_generation.py
      - name: Update generation-aware integration source expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/moderationV2IntegrationSource.test.mjs')
          source = path.read_text()

          old = 'isReusableModerationCache(uploadData, GEMINI_MODERATION_PROMPT_VERSION)'
          if source.count(old) != 2:
              raise SystemExit(f'cache source expectation: expected 2 matches, found {source.count(old)}')
          source = source.replace(old, 'isReusableModerationCache(uploadData, GEMINI_MODERATION_PROMPT_VERSION, currentGeneration)')

          replacements = [
              (
                  r"  assert.match(indexSource, /const findExactUpload = async \(sha256, \{ isCodexActor = false, themes = \[\], makerTags = \[\] \}/);",
                  r"  assert.match(indexSource, /const findExactUpload = async \(sha256, \{ isCodexActor = false, themes = \[\], makerTags = \[\], currentGeneration = 0 \}/);",
                  'exact signature expectation',
              ),
              (
                  r"  assert.match(indexSource, /findExactUpload\(fingerprints\.sha256, \{ isCodexActor, themes: normalizedThemes, makerTags: normalizedMakerTags \}\)/);",
                  r"  assert.match(indexSource, /findExactUpload\(fingerprints\.sha256,\s*\{[\s\S]{0,240}?isCodexActor,[\s\S]{0,240}?themes: normalizedThemes,[\s\S]{0,240}?makerTags: normalizedMakerTags,[\s\S]{0,240}?currentGeneration: requestModerationGeneration,[\s\S]{0,40}?\}\)/);",
                  'exact call expectation',
              ),
              (
                  r"  assert.match(indexSource, /findNearDuplicateUpload\(fingerprints, \{ isCodexActor, themes: normalizedThemes, makerTags: normalizedMakerTags, userId \}\)/);",
                  r"  assert.match(indexSource, /findNearDuplicateUpload\(fingerprints,\s*\{[\s\S]{0,280}?isCodexActor,[\s\S]{0,280}?themes: normalizedThemes,[\s\S]{0,280}?makerTags: normalizedMakerTags,[\s\S]{0,280}?userId,[\s\S]{0,160}?currentGeneration: requestModerationGeneration,[\s\S]{0,40}?\}\)/);",
                  'near call expectation',
              ),
              (
                  "  assert.ok(indexSource.includes('findNearDuplicateUpload(fingerprints, { isCodexActor, themes: normalizedThemes, makerTags: normalizedMakerTags, userId })'));",
                  r"  assert.match(indexSource, /findNearDuplicateUpload\(fingerprints,\s*\{[\s\S]{0,280}?userId,[\s\S]{0,160}?currentGeneration: requestModerationGeneration,[\s\S]{0,40}?\}\)/);",
                  'same-uploader generation call expectation',
              ),
          ]
          for old_text, new_text, label in replacements:
              if source.count(old_text) != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {source.count(old_text)}')
              source = source.replace(old_text, new_text, 1)

          path.write_text(source)
          PY
      - name: Enforce generation architecture source invariants
        run: node --test tests/moderationGenerationArchitectureSource.test.mjs
      - name: Run generation and reuse regressions
        run: >-
          node --test
          functions/test/moderationGeneration.test.js
          functions/test/moderationReuseRouting.test.js
          functions/test/moderationExampleBuilder.test.js
      - name: Run full moderation policy suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:moderation-policy 2>&1 | tee moderation-policy.log
      - name: Run full Functions tests
        shell: bash
        run: |
          set -o pipefail
          node --test functions/test/*.test.js 2>&1 | tee functions-tests.log
      - name: Run Codex Dev isolation regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:codex-dev-isolation 2>&1 | tee codex-isolation.log
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Diff check
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee diff-check.log
      - name: Preserve validation failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-failure
          path: '*.log'
          if-no-files-found: warn
          retention-days: 1
      - name: Remove temporary harness and commit product refactor
        run: |
          rm -f scripts/temp_refactor_moderation_generation.py
          rm -f .github/workflows/temp_apply_moderation_generation_refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace fresh evaluation reservations with generation fence"
          git push origin HEAD:chatgpt/moderation-architecture-simplification
