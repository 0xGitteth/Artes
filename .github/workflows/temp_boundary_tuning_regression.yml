name: Temporary boundary tuning regression

on:
  push:
    branches:
      - temp/moderation-golden-expansion
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix functions
      - name: Patch candidate moderation boundary clarifications
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/geminiModerationContract.js')
          s = p.read_text()

          needle1 = "  '- underwear, lingerie, swimwear, a thong, or a string when intimate areas remain covered.',\n"
          add1 = needle1 + "  '- Lace, mesh, sheer panels or cut-outs do not count as transparent exposure unless a nipple, genital area, or bare buttock is actually visible through them.',\n  '- A solo lingerie/boudoir image remains adultDecision=\\\"none\\\" when nipples, genitals and bare buttocks are not visible and nudity is not strategically implied. Cleavage, thighs, hip/buttock contour, an arched back, hand-over-head pose, reclining/standing pose, bedroom setting, outdoor setting or provocative styling alone do not create implied nudity.',\n"
          if needle1 not in s:
              raise SystemExit('nudity insertion point not found')
          s = s.replace(needle1, add1, 1)

          needle2 = "  'Sexual context can still make a clothed image adult-only:',\n"
          add2 = needle2 + "  '- Do NOT add adultEroticSuggestive merely because an adult wears lingerie, shows cleavage/thighs, poses sensually, arches their back, looks at the camera, is photographed in a bedroom/boudoir setting, or uses glamorous/provocative styling. Ordinary solo boudoir is general content.',\n  '- For a solo adult, require overt sexual behavior, direct sexual touching, use of a sex toy, or an unmistakable simulated sex act before adultEroticSuggestive is warranted. Sensual presentation alone is not enough.',\n  '- For interacting adults, clearly sexualized interaction can warrant adultEroticSuggestive even when everyone remains covered, for example straddling while making out, sexualized buttock/crotch grabbing, kneeling at another adult's crotch, a face positioned between another adult's legs, or comparable simulated sexual interaction. This still does NOT make adultDecision explicit unless the sexual act itself is visibly evidenced.',\n"
          if needle2 not in s:
              raise SystemExit('erotic insertion point not found')
          s = s.replace(needle2, add2, 1)

          needle3 = "  '- Do not infer masturbation, stimulation or penetration from arousal, wetness, bodily fluid, pose, framing or a genital close-up alone. The act itself must be visibly evidenced.',\n"
          add3 = needle3 + "  '- Do not infer oral sex or another explicit act merely from body position. A head/face near a clothed crotch, between thighs, kneeling near a crotch, a hand near a waistband, or another strongly suggestive position is NOT explicit when genital contact or the act itself is obscured by clothing, bodies, framing or crop. Use adultDecision=\\\"none\\\" plus adultEroticSuggestive when the context is clearly sexual but the act is not visibly evidenced.',\n"
          if needle3 not in s:
              raise SystemExit('explicit insertion point not found')
          s = s.replace(needle3, add3, 1)

          p.write_text(s)
          PY
      - name: Authenticate to artes-staging
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712508684856/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: artes-moderation-golden@artes-staging.iam.gserviceaccount.com
      - name: Run existing real-image regression gate
        env:
          ENABLE_GEMINI_CLASSIFIER: 'true'
          GOOGLE_CLOUD_PROJECT: artes-staging
          GOOGLE_CLOUD_LOCATION: europe-west4
          GEMINI_MODEL: gemini-2.5-flash
        run: npm run golden:moderation-v2:classifier
