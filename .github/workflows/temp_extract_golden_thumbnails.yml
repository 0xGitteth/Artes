name: Temporary extract golden thumbnails

on:
  push:
    branches:
      - temp/golden-staging-d58
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Create inspection thumbnails
        run: |
          mkdir -p /tmp/golden-thumbs
          node --input-type=module <<'NODE'
          import sharp from './functions/node_modules/sharp/lib/index.js';
          await sharp('testing/moderation_goldens_v1/images/safe/SAFE_01.jpg').resize({ width: 640 }).jpeg({ quality: 75 }).toFile('/tmp/golden-thumbs/SAFE_01.jpg');
          await sharp('testing/moderation_goldens_v1/images/boudoir/BOUDOIR_01.jpg').resize({ width: 640 }).jpeg({ quality: 75 }).toFile('/tmp/golden-thumbs/BOUDOIR_01.jpg');
          NODE
      - name: Upload inspection thumbnails
        uses: actions/upload-artifact@v4
        with:
          name: golden-inspection-thumbnails
          path: /tmp/golden-thumbs
          retention-days: 1
