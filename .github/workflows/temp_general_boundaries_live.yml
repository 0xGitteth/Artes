name: Temporary general boundary live check

on:
  push:
    branches:
      - temp/moderation-golden-expansion

permissions:
  contents: read
  id-token: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix functions
      - name: Download redistributable boundary sources
        run: |
          mkdir -p /tmp/artes-general-source /tmp/artes-general-normalized
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Fashion_model_portrait.jpg' -o /tmp/artes-general-source/portrait.jpg
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Shirtless_man_with_abs_-_Nawid_collection_31.jpg' -o /tmp/artes-general-source/topless.jpg
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Women_Wearing_Bikini.jpg' -o /tmp/artes-general-source/swimwear.jpg
      - name: Normalize and strip metadata
        run: |
          node --input-type=module <<'NODE'
          import sharp from './functions/node_modules/sharp/lib/index.js';
          for (const id of ['portrait', 'topless', 'swimwear']) {
            await sharp(`/tmp/artes-general-source/${id}.jpg`)
              .rotate()
              .resize({ width: 1600, height: 1600, fit: 'inside', withoutEnlargement: true })
              .jpeg({ quality: 88 })
              .toFile(`/tmp/artes-general-normalized/${id}.jpg`);
          }
          NODE
      - name: Authenticate to artes-staging
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712508684856/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: artes-moderation-golden@artes-staging.iam.gserviceaccount.com
      - name: Classify general boundary sources
        env:
          ENABLE_GEMINI_CLASSIFIER: 'true'
          GOOGLE_CLOUD_PROJECT: artes-staging
          GOOGLE_CLOUD_LOCATION: europe-west4
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { runGeminiClassifier } from './functions/geminiModerationClassifier.js';

          const cases = [
            ['GENERAL_PORTRAIT_01', '/tmp/artes-general-normalized/portrait.jpg'],
            ['MALE_TOPLESS_GENERAL_01', '/tmp/artes-general-normalized/topless.jpg'],
            ['SWIMWEAR_GENERAL_01', '/tmp/artes-general-normalized/swimwear.jpg'],
          ];

          for (const [id, file] of cases) {
            const result = await runGeminiClassifier({ buffer: await readFile(file), mimeType: 'image/jpeg' });
            console.log(JSON.stringify({ id, parsed: result.parsed, diagnostics: result.diagnostics }, null, 2));
            assert.ok(result.parsed, `${id} must return a validated classifier result`);
            assert.equal(result.parsed.adultDecision, 'none', `${id} must remain non-nude`);
            assert.deepEqual(result.parsed.forbiddenReasons, [], `${id} must not be forbidden`);
            const durableAdult = (result.parsed.triggers || []).filter((item) =>
              ['adultEroticSuggestive', 'kinkBdsm'].includes(item?.trigger) && Number(item?.confidence) >= 0.7
            );
            assert.deepEqual(durableAdult, [], `${id} must not receive a durable adult-context trigger`);
          }
          console.log('GENERAL_BOUNDARY_LIVE_ASSERTIONS_PASSED');
          NODE
