name: Temporary golden expansion validation

on:
  push:
    branches:
      - temp/moderation-golden-expansion

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Expanded expectation unit tests
        run: node --test functions/test/moderationGoldenManifestExpectations.test.js

      - name: Expanded golden dry run
        run: npm run golden:moderation-v2:expanded -- --dry-run

      - name: Authenticate to artes-staging
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712508684856/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: artes-moderation-golden@artes-staging.iam.gserviceaccount.com

      - name: Run existing real-image cases through expanded gate
        env:
          ENABLE_GEMINI_CLASSIFIER: 'true'
          GOOGLE_CLOUD_PROJECT: artes-staging
          GOOGLE_CLOUD_LOCATION: europe-west4
          GEMINI_MODEL: gemini-2.5-flash
        run: npm run golden:moderation-v2:expanded
