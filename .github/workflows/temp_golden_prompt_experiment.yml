name: Temporary golden prompt experiment

on:
  push:
    branches:
      - temp/golden-prompt-experiment
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact moderation head
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Patch prompt for strict nudity and kink separation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/geminiModerationContract.js')
          s = p.read_text()
          needle = "  '- underwear, lingerie, swimwear, a thong, or a string when intimate areas remain covered.',\n  '',\n  'Sexual context can still make a clothed image adult-only:',"
          repl = "  '- underwear, lingerie, swimwear, a thong, or a string when intimate areas remain covered.',\n  '',\n  'adultDecision describes nudity/explicitness only; adult-only sexual context is represented by triggers.',\n  '- Covered lingerie/underwear remains adultDecision=\\\"none\\\" when breasts, nipples, genitals and buttocks are not exposed and the image does not create the visual appearance of nudity.',\n  '- BDSM equipment, rope, restraints, fetish styling, erotic posing or sexual suggestion NEVER by themselves count as implied nudity. They may require adultEroticSuggestive/kinkBdsm triggers while adultDecision stays \\\"none\\\".',\n  '- Do not infer nudity merely because a clothed BDSM/kink image is sexual or fetishistic.',\n  '- Use adultDecision=\\\"borderline\\\" only when the visible body/clothing/crop itself shows or clearly creates the appearance of nudity under the explicit nudity rules above.',\n  '',\n  'Sexual context can still make a clothed image adult-only:',"
          if needle not in s:
              raise SystemExit('prompt insertion point not found')
          p.write_text(s.replace(needle, repl, 1))
          PY

      - name: Authenticate to artes-staging
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712508684856/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: artes-moderation-golden@artes-staging.iam.gserviceaccount.com

      - name: Run SAFE live classifier case
        env:
          ENABLE_GEMINI_CLASSIFIER: 'true'
          GOOGLE_CLOUD_PROJECT: artes-staging
          GOOGLE_CLOUD_LOCATION: europe-west4
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { runGeminiClassifier } from './functions/geminiModerationClassifier.js';
          const file = 'testing/moderation_goldens_v1/images/safe/SAFE_01.jpg';
          const result = await runGeminiClassifier({ buffer: await readFile(file), mimeType: 'image/jpeg' });
          console.log(JSON.stringify({ id: 'SAFE_01', parsed: result.parsed, diagnostics: result.diagnostics }, null, 2));
          NODE
