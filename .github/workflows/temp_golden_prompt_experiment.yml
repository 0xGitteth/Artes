name: Temporary golden prompt experiment

on:
  push:
    branches:
      - temp/golden-prompt-experiment
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix functions
      - name: Authenticate to artes-staging
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712508684856/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: artes-moderation-golden@artes-staging.iam.gserviceaccount.com
      - name: Run custom boundary prompt against Gemini
        env:
          GOOGLE_CLOUD_PROJECT: artes-staging
          GOOGLE_CLOUD_LOCATION: europe-west4
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          cd functions
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { VertexAI } from '@google-cloud/vertexai';
          import { buildGeminiModerationPrompt, parseGeminiModerationJson, normalizeGeminiModerationResult } from './geminiModerationContract.js';

          const clarifications = `
          MANDATORY ADULT BOUNDARY CLARIFICATIONS:
          - adultDecision describes nudity/explicitness only; adult-only sexual context is represented separately by triggers.
          - Covered lingerie/underwear remains adultDecision="none" when breasts, nipples, genitals and buttocks are not exposed and the image does not create the visual appearance of nudity.
          - BDSM equipment, rope, restraints, fetish styling, erotic posing or sexual suggestion NEVER by themselves count as implied nudity. They may require adultEroticSuggestive/kinkBdsm triggers while adultDecision stays "none".
          - Do not infer nudity merely because a clothed BDSM/kink image is sexual or fetishistic.
          - Visible genitals alone are NOT a sexual act. A close-up of exposed genitals, including visible natural moisture or a droplet/fluid, stays adultDecision="borderline" unless the image also visibly shows touching/stimulation, penetration, oral contact, masturbation or another unambiguous sex act.
          - Do not infer masturbation, stimulation or penetration from arousal, wetness, bodily fluid, pose, framing or a genital close-up alone. The act itself must be visibly evidenced.
          `;
          const prompt = `${buildGeminiModerationPrompt()}\n${clarifications}`;
          const vertex = new VertexAI({ project: process.env.GOOGLE_CLOUD_PROJECT, location: process.env.GOOGLE_CLOUD_LOCATION });
          const model = vertex.getGenerativeModel({ model: process.env.GEMINI_MODEL });

          const classify = async (id, path) => {
            const buffer = await readFile(path);
            const result = await model.generateContent({
              contents: [{ role: 'user', parts: [{ text: prompt }, { inlineData: { data: buffer.toString('base64'), mimeType: 'image/jpeg' } }] }],
              generationConfig: { temperature: 0, responseMimeType: 'application/json' },
            });
            const text = result?.response?.candidates?.[0]?.content?.parts?.map((p) => p?.text || '').join('') || '';
            const parsed = normalizeGeminiModerationResult(parseGeminiModerationJson(text));
            console.log(JSON.stringify({ id, parsed }, null, 2));
            return parsed;
          };

          const safe = await classify('SAFE_01', '../testing/moderation_goldens_v1/images/safe/SAFE_01.jpg');
          assert.equal(safe?.adultDecision, 'none');
          assert.ok(safe?.triggers?.some((t) => t.trigger === 'adultEroticSuggestive'));
          assert.ok(safe?.triggers?.some((t) => t.trigger === 'kinkBdsm'));

          for (const suffix of ['A', 'B', 'C']) {
            const borderline = await classify(`BORDERLINE_01_${suffix}`, '../testing/moderation_goldens_v1/images/borderline/BORDERLINE_01.jpg');
            assert.equal(borderline?.adultDecision, 'borderline');
            assert.ok(!borderline?.forbiddenReasons?.includes('sexualExplicit'));
          }

          const explicit = await classify('EXPLICIT_01', '../testing/moderation_goldens_v1/images/explicit/EXPLICIT_01.jpg');
          assert.equal(explicit?.adultDecision, 'explicit');
          assert.ok(explicit?.forbiddenReasons?.includes('sexualExplicit'));
          console.log('CUSTOM_BOUNDARY_PROMPT_ASSERTIONS_PASSED');
          NODE
