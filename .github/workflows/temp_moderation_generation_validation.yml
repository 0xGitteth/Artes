name: Temporary moderation generation validation

on:
  push:
    branches:
      - chatgpt/moderation-architecture-simplification

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run generation and reuse unit tests
        run: >-
          node --test
          functions/test/moderationGeneration.test.js
          functions/test/moderationReuseRouting.test.js
          functions/test/moderationExampleBuilder.test.js
