name: Temporary moderation golden staging

on:
  push:
    branches:
      - temp/golden-staging-d58
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  golden-classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact moderation head
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to artes-staging
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712508684856/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: artes-moderation-golden@artes-staging.iam.gserviceaccount.com

      - name: Run real Gemini moderation golden classifier
        env:
          ENABLE_GEMINI_CLASSIFIER: 'true'
          GOOGLE_CLOUD_PROJECT: artes-staging
          GOOGLE_CLOUD_LOCATION: europe-west4
          GEMINI_MODEL: gemini-2.5-flash
        run: node functions/scripts/runModerationGoldenV2Classifier.js
