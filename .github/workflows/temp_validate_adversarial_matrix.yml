name: Temporary moderation adversarial matrix validation

on:
  push:
    branches:
      - chatgpt/moderation-architecture-simplification
    paths:
      - .github/workflows/temp_validate_adversarial_matrix.yml
      - tests/moderationAdversarialMatrix.test.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/moderation-architecture-simplification
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run adversarial matrix
        shell: bash
        run: |
          set -o pipefail
          node --test tests/moderationAdversarialMatrix.test.mjs 2>&1 | tee adversarial-matrix.log
          git diff --check

      - name: Run moderation policy suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:moderation-policy 2>&1 | tee moderation-policy.log

      - name: Run full Functions tests
        shell: bash
        run: |
          set -o pipefail
          node --test functions/test/*.test.js 2>&1 | tee functions-tests.log

      - name: Run moderation architecture regressions
        shell: bash
        run: |
          set -o pipefail
          node --test tests/moderation*.mjs tests/pendingApprovedUpload.logic.test.mjs 2>&1 | tee moderation-architecture.log

      - name: Run Firestore and Storage rules suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-tests.log

      - name: Run Codex Dev isolation regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:codex-dev-isolation 2>&1 | tee codex-isolation.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Verify matrix anchors
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee diff-check.log
          grep -q "adversarial cache matrix" tests/moderationAdversarialMatrix.test.mjs
          grep -q "publication racing a queue" tests/moderationAdversarialMatrix.test.mjs
          grep -q "deleted selections" tests/moderationAdversarialMatrix.test.mjs
          grep -q "scheduled cleanup" tests/moderationAdversarialMatrix.test.mjs
          grep -q "correction provenance" tests/moderationAdversarialMatrix.test.mjs
          grep -q "JSON consent timestamps" tests/moderationAdversarialMatrix.test.mjs
          grep -q "draft, resume and correction publication" tests/moderationAdversarialMatrix.test.mjs

      - name: Preserve validation failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: moderation-adversarial-matrix-failure
          path: '*.log'
          if-no-files-found: warn
          retention-days: 1

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/temp_validate_adversarial_matrix.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove adversarial matrix validation harness"
          git push origin HEAD:chatgpt/moderation-architecture-simplification
