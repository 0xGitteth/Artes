name: Temporary atomic automatic review finalization

on:
  push:
    branches:
      - chatgpt/moderation-architecture-simplification
    paths:
      - .github/workflows/temp_validate_atomic_automatic_review_finalization.yml
      - temp_finalize_automatic_review_with_upload.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/moderation-architecture-simplification
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Apply atomic automatic review refactor
        run: python temp_finalize_automatic_review_with_upload.py

      - name: Verify focused automatic review regressions
        shell: bash
        run: |
          set -o pipefail
          node --test \
            functions/test/uploadReuseIsolation.test.js \
            tests/moderationAutomaticReviewFinalizationSource.test.mjs \
            tests/moderationLifecycleSource.test.mjs \
            tests/moderationV2IntegrationSource.test.mjs 2>&1 | tee automatic-review-focused.log
          git diff --check

      - name: Run moderation policy suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:moderation-policy 2>&1 | tee moderation-policy.log

      - name: Run full Functions tests
        shell: bash
        run: |
          set -o pipefail
          node --test functions/test/*.test.js 2>&1 | tee functions-tests.log

      - name: Run architecture and client routing regressions
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/moderationGenerationArchitectureSource.test.mjs \
            tests/moderationLifecycleSource.test.mjs \
            tests/moderationCanonicalLifecycleSource.test.mjs \
            tests/moderationAutomaticReviewFinalizationSource.test.mjs \
            tests/moderationFinalReviewSource.test.mjs \
            tests/moderationPreviewRetentionSelfReviewSource.test.mjs \
            tests/moderationPreviewRetentionSource.test.mjs \
            tests/moderationPreviewStorageSource.test.mjs \
            tests/moderationV2IntegrationSource.test.mjs \
            tests/moderationPublicationRouting.logic.test.mjs \
            tests/pendingApprovedUpload.logic.test.mjs 2>&1 | tee architecture-tests.log

      - name: Run Firestore and Storage rules suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-tests.log

      - name: Run Codex Dev isolation regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:codex-dev-isolation 2>&1 | tee codex-isolation.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Verify final diff invariants
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee diff-check.log
          grep -q "const findOpenReviewCaseInTransaction = async" functions/index.js
          grep -q "const finalizationResult = await db.runTransaction" functions/index.js
          grep -q "transaction.create(automaticReviewRef" functions/index.js
          grep -q "reviewCaseId: transactionReviewCaseId || null" functions/index.js
          grep -q "const durablePersistenceError = new Error" functions/index.js
          grep -q "reviewCaseMatchesCurrentUploadEvidence" functions/uploadReuseIsolation.js
          ! grep -q "let reviewCaseId = policyResult.reviewCaseId" functions/index.js
          ! grep -q "if (reviewCaseId && uploadId)" functions/index.js
          ! grep -q "Review case koppelen mislukt" functions/index.js

      - name: Preserve validation failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-automatic-review-finalization-failure
          path: '*.log'
          if-no-files-found: warn
          retention-days: 1

      - name: Remove temporary harness and commit validated product changes
        run: |
          rm -f temp_finalize_automatic_review_with_upload.py .github/workflows/temp_validate_atomic_automatic_review_finalization.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize automatic review with moderation upload"
          git push origin HEAD:chatgpt/moderation-architecture-simplification
