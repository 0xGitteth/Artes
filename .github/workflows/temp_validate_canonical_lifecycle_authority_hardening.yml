name: Temporary canonical lifecycle authority hardening

on:
  push:
    branches:
      - chatgpt/moderation-architecture-simplification
    paths:
      - .github/workflows/temp_validate_canonical_lifecycle_authority_hardening.yml
      - temp_harden_canonical_lifecycle_authority.py
      - temp_fix_canonical_lifecycle_authority_assertions.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/moderation-architecture-simplification
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Apply canonical lifecycle authority hardening
        run: python temp_harden_canonical_lifecycle_authority.py

      - name: Align media source assertions with canonical lifecycle
        run: python temp_fix_canonical_lifecycle_authority_assertions.py

      - name: Verify canonical lifecycle source invariants
        shell: bash
        run: |
          set -o pipefail
          node --test tests/moderationCanonicalLifecycleSource.test.mjs 2>&1 | tee lifecycle-source.log
          git diff --check

      - name: Run focused lifecycle regressions
        shell: bash
        run: |
          set -o pipefail
          node --test \
            functions/test/moderationLifecycle.test.js \
            functions/test/userModerationActionPolicy.test.js \
            functions/test/uploaderCorrection.test.js \
            functions/test/correctionReviewOwnership.test.js \
            functions/test/moderationPreviewStorage.test.js 2>&1 | tee lifecycle-focused.log

      - name: Run moderation policy suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:moderation-policy 2>&1 | tee moderation-policy.log

      - name: Run full Functions tests
        shell: bash
        run: |
          set -o pipefail
          node --test functions/test/*.test.js 2>&1 | tee functions-tests.log

      - name: Run architecture and client routing regressions
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/moderationGenerationArchitectureSource.test.mjs \
            tests/moderationLifecycleSource.test.mjs \
            tests/moderationCanonicalLifecycleSource.test.mjs \
            tests/moderationFinalReviewSource.test.mjs \
            tests/moderationPreviewRetentionSelfReviewSource.test.mjs \
            tests/moderationPreviewRetentionSource.test.mjs \
            tests/moderationPreviewStorageSource.test.mjs \
            tests/moderationV2IntegrationSource.test.mjs \
            tests/moderationPublicationRouting.logic.test.mjs \
            tests/pendingApprovedUpload.logic.test.mjs 2>&1 | tee architecture-tests.log

      - name: Run Firestore and Storage rules suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-tests.log

      - name: Run Codex Dev isolation regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:codex-dev-isolation 2>&1 | tee codex-isolation.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Verify final diff invariants
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee diff-check.log
          grep -q "canSaveDraftUpload(upload)" functions/index.js
          grep -q "canManageApprovedUploadPrompt(upload)" functions/index.js
          grep -q "latestPublicationLifecycle = resolveUploadPublicationState(latestUpload)" functions/index.js
          grep -q "beforePublication = resolveUploadPublicationState(before)" functions/index.js
          grep -q "afterPublication = resolveUploadPublicationState(after)" functions/index.js
          ! grep -q "upload?.reviewStatus !== 'approved'" functions/index.js
          ! grep -q "initialPublicationStatus" functions/index.js
          ! grep -q "latestPublicationStatus" functions/index.js

      - name: Preserve validation failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-lifecycle-authority-hardening-failure
          path: '*.log'
          if-no-files-found: warn
          retention-days: 1

      - name: Remove temporary harness and commit validated product changes
        run: |
          rm -f temp_harden_canonical_lifecycle_authority.py temp_fix_canonical_lifecycle_authority_assertions.py .github/workflows/temp_validate_canonical_lifecycle_authority_hardening.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish canonical moderation lifecycle authority"
          git push origin HEAD:chatgpt/moderation-architecture-simplification
