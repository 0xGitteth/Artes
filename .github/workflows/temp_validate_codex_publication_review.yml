name: Temporary Codex publication review validation

on:
  push:
    branches:
      - chatgpt/moderation-architecture-simplification
    paths:
      - .github/workflows/temp_validate_codex_publication_review.yml
      - temp_fix_codex_publication_review.py
      - functions/userModerationActionPolicy.js
      - functions/test/userModerationActionPolicy.test.js
      - src/utils/moderationApiBase.js
      - tests/moderationApiBase.logic.test.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/moderation-architecture-simplification
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Apply Codex review fixes
        run: python temp_fix_codex_publication_review.py

      - name: Run focused publication regressions
        shell: bash
        run: |
          set -o pipefail
          node --test \
            functions/test/userModerationActionPolicy.test.js \
            tests/moderationApiBase.logic.test.mjs \
            tests/moderationCodexReviewFixesSource.test.mjs \
            tests/moderationPublicationRouting.logic.test.mjs \
            tests/moderationCorrectionClientSource.test.mjs 2>&1 | tee codex-review-focused.log
          git diff --check

      - name: Run moderation policy suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:moderation-policy 2>&1 | tee moderation-policy.log

      - name: Run full Functions tests
        shell: bash
        run: |
          set -o pipefail
          node --test functions/test/*.test.js 2>&1 | tee functions-tests.log

      - name: Run moderation architecture regressions
        shell: bash
        run: |
          set -o pipefail
          node --test tests/moderation*.mjs tests/pendingApprovedUpload.logic.test.mjs 2>&1 | tee moderation-architecture.log

      - name: Run Firestore and Storage rules suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-tests.log

      - name: Run Codex Dev isolation regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:codex-dev-isolation 2>&1 | tee codex-isolation.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Verify final review invariants
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee diff-check.log
          grep -q "getServerPublicPostPublishDecision" functions/index.js
          grep -q "tokenClaims: decoded" functions/index.js
          grep -q "tokenClaims.email_verified !== true" functions/userModerationActionPolicy.js
          grep -q "tokenClaims.idvVerified !== true" functions/userModerationActionPolicy.js
          grep -q "tokenClaims.isAdult !== true" functions/userModerationActionPolicy.js
          grep -q "resolveModerationApiBase(import.meta.env)" src/ArtesApp.jsx
          grep -q "VITE_FUNCTIONS_BASE_URL" src/utils/moderationApiBase.js
          grep -q "VITE_FUNCTIONS_BASE" src/utils/moderationApiBase.js

      - name: Preserve validation failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codex-publication-review-failure
          path: '*.log'
          if-no-files-found: warn
          retention-days: 1

      - name: Remove temporary harness and commit validated fixes
        run: |
          rm -f temp_fix_codex_publication_review.py .github/workflows/temp_validate_codex_publication_review.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Address Codex publication review findings"
          git push origin HEAD:chatgpt/moderation-architecture-simplification
