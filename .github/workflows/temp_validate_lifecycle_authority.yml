name: Temporary canonical lifecycle authority validation

on:
  push:
    branches:
      - chatgpt/moderation-architecture-simplification
    paths:
      - .github/workflows/temp_validate_lifecycle_authority.yml
      - temp_unify_client_server_lifecycle_authority.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/moderation-architecture-simplification
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Apply lifecycle authority refactor
        run: python temp_unify_client_server_lifecycle_authority.py

      - name: Verify focused lifecycle regressions
        shell: bash
        run: |
          set -o pipefail
          node --test \
            functions/test/moderationLifecycle.test.js \
            functions/test/userModerationActionPolicy.test.js \
            tests/moderationUploadLifecycle.logic.test.mjs \
            tests/pendingApprovedUpload.logic.test.mjs \
            tests/moderationPublicationRouting.logic.test.mjs \
            tests/moderationCorrectionClientSource.test.mjs \
            tests/moderationClientLifecycleAuthoritySource.test.mjs 2>&1 | tee lifecycle-focused.log
          git diff --check

      - name: Run moderation policy suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:moderation-policy 2>&1 | tee moderation-policy.log

      - name: Run full Functions tests
        shell: bash
        run: |
          set -o pipefail
          node --test functions/test/*.test.js 2>&1 | tee functions-tests.log

      - name: Run moderation architecture and client regressions
        shell: bash
        run: |
          set -o pipefail
          node --test tests/moderation*.mjs tests/pendingApprovedUpload.logic.test.mjs 2>&1 | tee moderation-architecture.log

      - name: Run Firestore and Storage rules suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-tests.log

      - name: Run Codex Dev isolation regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:codex-dev-isolation 2>&1 | tee codex-isolation.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Verify final lifecycle invariants
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee diff-check.log
          grep -q "Canonical state is the server-owned authority" functions/moderationLifecycle.js
          grep -q "resolveClientUploadLifecycle" src/utils/moderationUploadLifecycle.js
          grep -q "isClientUploadAllowedPending" src/utils/pendingApprovedUpload.js
          grep -q "where('moderationState', '==', 'allowed')" src/ArtesApp.jsx
          grep -q "where('publicationState', '==', 'pending')" src/ArtesApp.jsx
          grep -q "isClientUploadCorrectionPending(uploadData)" src/ArtesApp.jsx
          grep -q "isClientUploadDiscarded(uploadData)" src/ArtesApp.jsx
          ! grep -q "moderation_state_conflict" functions/moderationLifecycle.js
          ! grep -q "publication_state_conflict" functions/moderationLifecycle.js

      - name: Preserve validation failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-authority-failure
          path: '*.log'
          if-no-files-found: warn
          retention-days: 1

      - name: Remove temporary harness and commit validated product changes
        run: |
          rm -f temp_unify_client_server_lifecycle_authority.py .github/workflows/temp_validate_lifecycle_authority.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make canonical moderation lifecycle authoritative"
          git push origin HEAD:chatgpt/moderation-architecture-simplification
