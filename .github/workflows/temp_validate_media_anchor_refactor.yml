name: Temporary media anchor refactor validation

on:
  push:
    branches:
      - chatgpt/moderation-architecture-simplification
    paths:
      - .github/workflows/temp_validate_media_anchor_refactor.yml
      - temp_apply_media_anchor_refactor.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/moderation-architecture-simplification
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Apply media anchor refactor
        run: python temp_apply_media_anchor_refactor.py

      - name: Verify no parallel cleanup-task state remains
        run: |
          ! grep -R "moderationPreviewCleanupTasks" functions tests firestore.rules docs --exclude-dir=node_modules
          git diff --check

      - name: Run focused media lifecycle regressions
        run: |
          node --test \
            functions/test/moderationPreviewStorage.test.js \
            functions/test/userModerationActionPolicy.test.js \
            functions/test/moderationReuseRouting.test.js \
            tests/moderationPr378P2Source.test.mjs \
            tests/moderationPreviewStorageSource.test.mjs

      - name: Run moderation policy suite
        run: npm run test:moderation-policy

      - name: Run full Functions tests
        run: node --test functions/test/*.test.js

      - name: Run architecture and lifecycle source regressions
        run: |
          node --test \
            tests/moderationGenerationArchitectureSource.test.mjs \
            tests/moderationLifecycleSource.test.mjs \
            tests/moderationFinalReviewSource.test.mjs \
            tests/moderationPreviewRetentionSelfReviewSource.test.mjs \
            tests/moderationPreviewRetentionSource.test.mjs \
            tests/moderationPreviewStorageRulesSource.test.mjs \
            tests/moderationV2IntegrationSource.test.mjs

      - name: Run Firestore and Storage rules suite
        run: npm run test:rules

      - name: Run Codex Dev isolation regressions
        run: npm run test:codex-dev-isolation

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify final diff invariants
        run: |
          git diff --check
          git diff --exit-code -- . ':!temp_apply_media_anchor_refactor.py' ':!.github/workflows/temp_validate_media_anchor_refactor.yml' >/dev/null || true
          test -z "$(grep -R -l "moderationPreviewCleanupTasks" functions tests firestore.rules docs --exclude-dir=node_modules || true)"
          grep -q "mediaState: 'pending'" functions/index.js
          grep -q "mediaState: 'ready'" functions/index.js
          grep -q "mediaCleanupAfter" functions/index.js

      - name: Remove temporary harness and commit validated product changes
        run: |
          rm -f temp_apply_media_anchor_refactor.py .github/workflows/temp_validate_media_anchor_refactor.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make uploads the durable moderation media anchor"
          git push origin HEAD:chatgpt/moderation-architecture-simplification
